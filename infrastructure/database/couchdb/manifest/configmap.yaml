apiVersion: v1
kind: ConfigMap
metadata:
  name: couchdb-cors-config
  namespace: couchdb
data:
  cors.ini: |
    [chttpd]
    enable_cors = true

    [cors]
    enable_cors = true
    origins = *
    credentials = true
    headers = accept, authorization, content-type, origin, referer, x-csrf-token
    methods = GET, PUT, POST, HEAD, DELETE, OPTIONS
