apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: couchdb-secret
  namespace: couchdb

spec:
  refreshInterval: "5m"

  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore

  target:
    name: couchdb
    creationPolicy: Owner

  data:
    - secretKey: COUCHDB_USER
      remoteRef:
        key: secret/ridercorp/kubernetes/couchdb
        property: couchdb_user
    - secretKey: COUCHDB_PASSWORD
      remoteRef:
        key: secret/ridercorp/kubernetes/couchdb
        property: couchdb_password
