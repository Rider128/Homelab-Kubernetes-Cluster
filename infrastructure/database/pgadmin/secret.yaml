apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: pgamdmin-secret
  namespace: pgadmin

spec:
  refreshInterval: "5m"

  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore

  target:
    name: pgadmin
    creationPolicy: Owner

  data:
    - secretKey: default_user
      remoteRef:
        key: secret/ridercorp/kubernetes/pgadmin
        property: default_user
    - secretKey: default_password
      remoteRef:
        key: secret/ridercorp/kubernetes/pgadmin
        property: default_password
