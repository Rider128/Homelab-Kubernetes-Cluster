apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: traefik-secrets
  namespace: traefik

spec:
  refreshInterval: "5m"

  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore

  target:
    name: traefik-secrets
    creationPolicy: Owner

  data:
    - secretKey: CLOUDFLARE_DNS_API_TOKEN
      remoteRef:
        key: secret/ridercorp/kubernetes/traefik
        property: cloudflare_dns_api_token
