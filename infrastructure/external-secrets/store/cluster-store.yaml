---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: "https://openbao.ridercorp.org"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes-ridercorp"
          role: "eso-ridercorp"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
