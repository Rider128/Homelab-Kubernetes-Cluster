apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dashy-config
  namespace: dashy
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: dashy-config-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          ---
          pageInfo:
            title: Ridercorp
            description: Ici on peut retrouver tous les services de la ridercorp!

            navLinks:
            - title: Portefolio
              path: https://matthieudaniel-thomas.fr

          appConfig:
            theme: colorful
            statusCheck: false
            auth:
              enableGuestAccess: true
              users:
              - user: rider
                hash: "{{ .ADMIN_HASH }}"
                type: admin

          sections:
          - name: Medias
            icon: fas fa-rocket
            items:
            - title: Jellyfin
              description: Platforme pour regarder des films et series
              icon: hl-jellyfin
              url: https://jellyfin.ridercorp.org
              target: newtab
              statusCheck: true
            - title: Jellyseerr
              description: Pour demander du contenu à ajouter sur jllyfin
              url: https://jellyseerr.ridercorp.org
              icon: hl-jellyseerr
              target: newtab
          - name: Service Transverse
            icon: fas Fa-Umbrella
            items:
            - title: Netbird (VPN)
              icon: hl-netbird
              url: https://netbird.daniel-thomas.fr
              target: newtab
            - title: PDF
              icon: sh-stringling-pdf
              url: https://pdf.ridercorp.org
            - title: RidercorpIA
              icon: https://docs.openwebui.com/images/logo.png
            - title: Nextcloud
              icon: sh-nextcloud
              url: https://nextcloud.daniel-thomas.fr
            - title: Status
              icon: sh-uptime-kuma
              url: http://45.88.180.149:3001/status/services
            - title: Gitlab
              icon: sh-gitlab
              url: https://gitlab.innovalia.cc
            - title: Pelican (Serveur de jeux)
              icon: sh-pelican-panel
              url: https://pelican.ridercorp.org
            - title: Nextcloud (Alpha)
              icon: sh-nextcloud
              url: https://nextcloud.daniel-thomas.fr
  data:
    - secretKey: ADMIN_HASH
      remoteRef:
        key: secret/ridercorp/kubernetes/dashy
        property: ADMIN_HASH
