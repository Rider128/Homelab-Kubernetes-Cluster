apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: atuin-secret
  namespace: atuin

spec:
  refreshInterval: "5m"

  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore

  target:
    name: atuin-secrets
    creationPolicy: Owner

  data:
    - secretKey: ATUIN_DB_URI
      remoteRef:
        key: secret/ridercorp/kubernetes/atuin
        property: ATUIN_DB_URI