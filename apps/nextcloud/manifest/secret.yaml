apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: nextcloud
  namespace: nextcloud

spec:
  refreshInterval: "5m"

  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore

  target:
    name: nextcloud
    creationPolicy: Owner

  data:
    - secretKey: pg_user
      remoteRef:
        key: secret/ridercorp/kubernetes/nextcloud
        property: pg_user
    - secretKey: pg_pass
      remoteRef:
        key: secret/ridercorp/kubernetes/nextcloud
        property: pg_pass
    - secretKey: pg_db
      remoteRef:
        key: secret/ridercorp/kubernetes/nextcloud
        property: pg_db
    - secretKey: username
      remoteRef:
        key: secret/ridercorp/kubernetes/nextcloud
        property: username
    - secretKey: password
      remoteRef:
        key: secret/ridercorp/kubernetes/nextcloud
        property: password
    - secretKey: host
      remoteRef:
        key: secret/ridercorp/kubernetes/nextcloud
        property: host
    - secretKey: smtp-host
      remoteRef:
        key: secret/ridercorp/kubernetes/nextcloud
        property: smtp-host
    - secretKey: smtp-username
      remoteRef:
        key: secret/ridercorp/kubernetes/nextcloud
        property: smtp-username
    - secretKey: smtp-password
      remoteRef:
        key: secret/ridercorp/kubernetes/nextcloud
        property: smtp-password
    - secretKey: clientid
      remoteRef:
        key: secret/ridercorp/kubernetes/nextcloud
        property: clientID
    - secretKey: clientsecret
      remoteRef:
        key: secret/ridercorp/kubernetes/nextcloud
        property: clientSecret
