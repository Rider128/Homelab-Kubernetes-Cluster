---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-nextcloud
spec:
  storageClassName: nfs
  capacity:
    storage: 1Mi # Size does not matter
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: truenas.internal
    path: /mnt/grappe/storage/kube/nextcloud/nextcloud-app
  mountOptions:
    - nfsvers=4.2
    - nconnect=8
    - hard
    - noatime
    - rsize=131072
    - wsize=131072
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-nextcloud
  namespace: nextcloud
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: nfs
  volumeName: nextcloud-nextcloud
  resources:
    requests:
      storage: 1Mi # Size does not matter
