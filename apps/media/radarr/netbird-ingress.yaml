apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr-netbird-ingress
  namespace: medias
spec:
  ingressClassName: traefik
  rules:
    - host: radarr.proxy.daniel-thomas.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radarr
                port:
                  number: 7878
