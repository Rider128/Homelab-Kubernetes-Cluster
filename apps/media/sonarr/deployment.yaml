apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: medias
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      restartPolicy: Always
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - kube-quartz
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:4.0.17.2952-ls305

          ports:
            - containerPort: 8989
              name: http-sonarr
              protocol: TCP
          env:
            - name: PUID
              value: "1001"
            - name: PGID
              value: "129"
            - name: TZ
              value: "Europe/Paris"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: sonarr-config
              mountPath: /config
            - name: truenas-series
              mountPath: /data/series
              readOnly: false
            - name: truenas-anime
              mountPath: /data/anime
              readOnly: false
            - name: truenas-downloads
              mountPath: /downloads

      volumes:
        - name: sonarr-config
          persistentVolumeClaim:
            claimName: sonarr-config-nfs
        # NFS Mounts
        - name: truenas-series
          nfs:
            server: truenas.internal
            path: "/mnt/grappe/Medias/Series"
            readOnly: false
        - name: truenas-anime
          nfs:
            server: truenas.internal
            path: "/mnt/grappe/Medias/Anime"
            readOnly: false
        - name: truenas-downloads
          nfs:
            server: truenas.internal
            path: "/mnt/grappe/Downloads/Media-Download"
            readOnly: false
