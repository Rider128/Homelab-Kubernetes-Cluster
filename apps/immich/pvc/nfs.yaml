apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: immich-nfs
provisioner: nfs
parameters:
  archiveOnDelete: "false"

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-nfs
spec:
  storageClassName: nfs
  capacity:
    storage: 1Mi # Size does not matter
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: truenas.internal
    path: /mnt/grappe/Photos
  mountOptions:
    - nfsvers=4.2
    - nconnect=8
    - hard
    - noatime
    - rsize=131072
    - wsize=131072
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-nfs
  namespace: immich
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: nfs
  volumeName: immich-nfs
  resources:
    requests:
      storage: 1Mi # Size does not matter
