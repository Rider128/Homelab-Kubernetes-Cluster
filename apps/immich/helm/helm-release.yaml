---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 2h
  chart:
    spec:
      chart: app-template
      version: 3.5.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 10m
  values:
    controllers:
      immich-machine-learning:
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v2.7.5
            env:
              DB_HOSTNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich
                    key: host
              DB_PORT: 5432
              DB_DATABASE_NAME: "immich"

              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich
                    key: pg_user

              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich
                    key: pg_pass
      immich-server:
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v2.7.5
            resources:
              requests:
                cpu: 100m
                memory: 250Mi
            env:
              DB_HOSTNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich
                    key: host
              DB_PORT: 5432
              DB_DATABASE_NAME: "immich"

              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich
                    key: pg_user

              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich
                    key: pg_pass
              IMMICH_MEDIA_LOCATION: /usr/src/app/upload
              REDIS_HOSTNAME: "immich-valkey"
              REDIS_PORT: "6379"
        pod:
          securityContext:
            supplementalGroups:
              - 568
      valkey:
        type: deployment
        replicas: 1
        containers:
          app:
            image:
              repository: docker.io/valkey/valkey
              tag: 9.0
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 512Mi


    service:
      main:
        controller: immich-server
        ports:
          http:
            port: 2283
      machine-learning:
        controller: immich-machine-learning
        ports:
          http:
            port: 3003
      valkey:
        controller: valkey
        ports:
          redis:
            port: 6379

    ingress:
      main:
        enabled: true
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/router.tls.certresolver: myresolver

        hosts:
          - host: photo.daniel-thomas.fr
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http

    persistence:
      library:
        enabled: true
        existingClaim: immich-nfs
        globalMounts:
          - path: /usr/src/app/upload
      geocoding-dump:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /usr/src/app/.reverse-geocoding-dump
      transformers-cache:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /usr/src/app/.transformers_cache
      import-syno-1:
        enabled: true
        existingClaim: import-syno-1
        globalMounts:
          - path: /import/syno-1
            readOnly: true
