apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: immich-secret
  namespace: immich

spec:
  refreshInterval: "5m"

  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore

  target:
    name: immich
    creationPolicy: Owner

  data:
    - secretKey: pg_user
      remoteRef:
        key: secret/ridercorp/kubernetes/immich
        property: pg_user
    - secretKey: pg_pass
      remoteRef:
        key: secret/ridercorp/kubernetes/immich
        property: pg_pass
    - secretKey: host
      remoteRef:
        key: secret/ridercorp/kubernetes/immich
        property: host
