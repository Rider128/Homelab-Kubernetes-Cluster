# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: context7
  namespace: ia
  labels:
    app:  context7
spec:
  selector:
    matchLabels:
      app:  context7
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container:   context7
      labels:
        app:  context7
    spec:
      # initContainers:
        # Init containers are exactly like regular containers, except:
          # - Init containers always run to completion.
          # - Each init container must complete successfully before the next one starts.
      containers:
      - name:  context7
        image: mcp/context7:latest
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 100Mi
        ports:
        - containerPort: 8080
          name:  mcp-context7
      restartPolicy: Always
---

