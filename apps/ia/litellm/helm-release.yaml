---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
  namespace: ia
spec:
  interval: 2h
  chart:
    spec:
      chart: app-template
      version: 4.4.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 10m
  values:
    controllers:
      main:
        strategy: Recreate

        containers:
          main:
            image:
              repository: ghcr.io/berriai/litellm
              tag: main-stable

              pullPolicy: IfNotPresent
            args:
              - "--config"
              - "/config/litellm_config.yaml"
              - "--detailed_debug"
            env:
              TZ: "Europe/Paris"
              GEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: ia-keys
                    key: gemini-key
              ANTHROPIC_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: ia-keys
                    key: anthropic-key
              OPENROUTER_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: ia-keys
                    key: openrouter-key
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1
                memory: 1Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 4000
    persistence:
      config:
        enabled: true
        type: configMap
        name: litellm-config # Doit correspondre au nom de ton ConfigMap
        globalMounts:
          - path: /config
