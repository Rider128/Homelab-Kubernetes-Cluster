apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: ia-keys
  namespace: ia

spec:
  refreshInterval: "5m"

  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore

  target:
    name: ia-keys
    creationPolicy: Owner

  data:
    - secretKey: gemini-key
      remoteRef:
        key: secret/ridercorp/kubernetes/ia/ia-keys
        property: gemini-key
    - secretKey: anthropic-key
      remoteRef:
        key: secret/ridercorp/kubernetes/ia/ia-keys
        property: anthropic-key
    - secretKey: openrouter-key
      remoteRef:
        key: secret/ridercorp/kubernetes/ia/ia-keys
        property: openrouter-key
    - secretKey: tavily-key
      remoteRef:
        key: secret/ridercorp/kubernetes/ia/ia-keys
        property: tavily-key
