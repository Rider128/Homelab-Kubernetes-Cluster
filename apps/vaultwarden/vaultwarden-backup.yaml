---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultwarden-backup-script
  namespace: vaultwarden
data:
  backup.sh: |
    #!/bin/sh
    set -e

    BACKUP_DIR="/backup/vaultwarden"
    DATA_DIR="/data"
    DATE=$(date +%Y-%m-%d_%H-%M-%S)
    DEST="$BACKUP_DIR/$DATE"
    RETENTION_DAYS=30

    echo "[$(date)] Début du backup Vaultwarden..."

    if ! mountpoint -q /backup; then
      echo "ERREUR: /backup n'est pas monté (NFS non disponible)"
      exit 1
    fi

    mkdir -p "$DEST"

    # 1. Backup SQLite via l'Online Backup API (méthode recommandée par la doc)
    #    Safe même si Vaultwarden écrit pendant le backup
    echo "[$(date)] Backup SQLite..."
    sqlite3 "$DATA_DIR/db.sqlite3" ".backup '$DEST/db.sqlite3'"

    # 2. Fichiers requis : attachments
    if [ -d "$DATA_DIR/attachments" ]; then
      cp -a "$DATA_DIR/attachments" "$DEST/"
    fi

    # 3. Fichiers recommandés : config.json + clés RSA
    for f in config.json rsa_key.der rsa_key.pem rsa_key.pub.der; do
      if [ -f "$DATA_DIR/$f" ]; then
        cp "$DATA_DIR/$f" "$DEST/"
      fi
    done

    # 4. Optionnel : sends (pièces jointes Send éphémères)
    if [ -d "$DATA_DIR/sends" ]; then
      cp -a "$DATA_DIR/sends" "$DEST/"
    fi

    # 5. Compression de l'ensemble
    echo "[$(date)] Compression..."
    tar -czf "$BACKUP_DIR/vaultwarden_$DATE.tar.gz" -C "$BACKUP_DIR" "$DATE"
    rm -rf "$DEST"

    echo "[$(date)] Archive: vaultwarden_$DATE.tar.gz ($(du -sh $BACKUP_DIR/vaultwarden_$DATE.tar.gz | cut -f1))"

    # 6. Rotation
    find "$BACKUP_DIR" -name "vaultwarden_*.tar.gz" -mtime +$RETENTION_DAYS -delete
    echo "[$(date)] Rotation OK (rétention: $RETENTION_DAYS jours)"
    echo "[$(date)] Backup terminé avec succès."
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vaultwarden-backup
  namespace: vaultwarden
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              # sqlite3 est dispo dans alpine avec le package sqlite
              image: alpine:3.24
              command: ["/bin/sh", "-c"]
              args:
                - |
                  apk add --no-cache sqlite > /dev/null 2>&1
                  /bin/sh /scripts/backup.sh
              volumeMounts:
                - name: vaultwarden-data
                  mountPath: /data
                  readOnly: true
                - name: nfs-backup
                  mountPath: /backup
                - name: backup-script
                  mountPath: /scripts
          volumes:
            - name: vaultwarden-data
              persistentVolumeClaim:
                claimName: vaultwarden-config-nfs
            - name: nfs-backup
              nfs:
                server: truenas.internal
                path: /mnt/grappe/backup
                readOnly: false
            - name: backup-script
              configMap:
                name: vaultwarden-backup-script
                defaultMode: 0755
