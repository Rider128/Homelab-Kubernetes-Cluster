apiVersion: apps/v1
kind: Deployment
metadata:
  name: ytdl
  namespace: ytdl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ytdl
  template:
    metadata:
      labels:
        app: ytdl
    spec:
      containers:
        - name: ytdl
          image: ghcr.io/alexta69/metube:2026.10.09
          ports:
            - containerPort: 8081
              name: http-ytdl
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
