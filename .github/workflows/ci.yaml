name: "CI Pipeline"

on:
  push:
    branches:
      - main
      - github-release
  pull_request:
    branches:
      - main

jobs:
  check:
    name: "Nix Flake Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = false

      - name: Run Nix Flake Check
        run: nix flake check --print-build-logs
